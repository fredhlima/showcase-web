<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pico do dia</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (SPEC) ---------- */
:root{
  --bg:#F5F0E6; --bg-2:#E3F4F1; --surface:#FFFFFF; --surface-2:#F0EBE1;
  --border:rgba(10,40,50,0.10); --text:#0B2530; --text-2:#3F5761;
  --accent:#0A8F8A; --accent-ink:#FFFFFF; --coral:#F2643D;
  --track:rgba(11,37,48,0.08); --sea-a:#D6F1EE; --sea-b:#A9DDD8; --land:#EFE7D7;
  --nav:rgba(255,255,255,0.90); --shadow:0 1px 2px rgba(11,37,48,.04),0 12px 32px -16px rgba(11,37,48,.22);
  --card-blur:none; --ink-pill:#06201A; --scrim:rgba(5,18,25,.42);
  --wave-2:#5AA9FF; --accent-soft:rgba(10,143,138,.12); --amber:#FFB547; --amber-ink:#8F5300; --amber-soft:rgba(255,181,71,.22); --coral-soft:rgba(242,100,61,.13);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#051219; --bg-2:#0A2A36; --surface:rgba(255,255,255,0.06); --surface-2:rgba(255,255,255,0.10);
    --border:rgba(255,255,255,0.10); --text:#E8F4F6; --text-2:#9DB7BF;
    --accent:#2EE6C5; --accent-ink:#03261F; --coral:#FF7A55;
    --track:rgba(255,255,255,0.10); --sea-a:#0E3B4A; --sea-b:#062330; --land:rgba(255,255,255,0.09);
    --nav:rgba(5,18,25,0.86); --shadow:none; --accent-soft:rgba(46,230,197,.14); --amber:#FFB547; --amber-ink:#FFB547; --amber-soft:rgba(255,181,71,.16); --coral-soft:rgba(255,122,85,.16); --card-blur:blur(14px); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#051219; --bg-2:#0A2A36; --surface:rgba(255,255,255,0.06); --surface-2:rgba(255,255,255,0.10);
  --border:rgba(255,255,255,0.10); --text:#E8F4F6; --text-2:#9DB7BF;
  --accent:#2EE6C5; --accent-ink:#03261F; --coral:#FF7A55;
  --track:rgba(255,255,255,0.10); --sea-a:#0E3B4A; --sea-b:#062330; --land:rgba(255,255,255,0.09);
  --nav:rgba(5,18,25,0.86); --shadow:none; --accent-soft:rgba(46,230,197,.14); --amber:#FFB547; --amber-ink:#FFB547; --amber-soft:rgba(255,181,71,.16); --coral-soft:rgba(255,122,85,.16); --card-blur:blur(14px); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh; color:var(--text);
  font:400 15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(180deg,var(--bg-2) 0,var(--bg) 460px) no-repeat, var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{opacity:.42;cursor:default}
h1,h2,h3,h4{margin:0;font-weight:800}
h1,h2,h3,h4,.num{font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif}
p{margin:0}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}

/* ---------- Layout ---------- */
.app{position:relative;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh}
.view{padding:0 16px calc(env(safe-area-inset-bottom) + 116px);min-width:0}
.view.enter{animation:viewIn .3s ease-out both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.banner{
  position:sticky;top:0;z-index:30;margin:0 -16px;
  padding:calc(env(safe-area-inset-top) + 7px) 16px 7px;text-align:center;
  font:600 11px/1.2 Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-2);background:var(--bg);border-bottom:1px solid var(--border);
}
.page-head{padding:20px 0 4px}
.page-head h1{font-size:32px;line-height:1.05;letter-spacing:-.025em;margin:10px 0 6px}
.lead{color:var(--text-2);font-size:14px}
.eyebrow{margin:0;font:600 11px/1.2 Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2)}
.card{
  position:relative;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:16px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);overflow:hidden;
}
.sec{margin-top:24px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px}
.sec-head h2{font-size:20px;line-height:1.2;letter-spacing:-.015em}
.sec-head span{font-size:13px;color:var(--text-2);white-space:nowrap}
.card h2{font-size:17px;letter-spacing:-.01em;margin-bottom:4px}
.hint{font-size:13px;color:var(--text-2);margin-bottom:12px}

.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);
  font:600 12px/1 Inter,system-ui,sans-serif;color:var(--text);white-space:nowrap;
}
.chip .ic{width:14px;height:14px;color:var(--accent)}
.pill{
  display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;
  font:700 12px/1 Inter,system-ui,sans-serif;color:var(--ink-pill);white-space:nowrap;
}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 8px;border-radius:999px;
  background:var(--surface-2);font:600 11px/1 Inter,system-ui,sans-serif;color:var(--text);white-space:nowrap;
}
.tag.terral{color:var(--accent)}
.tag.maral{color:var(--coral)}

/* ---------- Ondas ---------- */
.ondas{position:relative;height:72px;margin:14px -16px 0;overflow:hidden;pointer-events:none}
.ondas.abs{position:absolute;left:0;right:0;bottom:0;margin:0;height:86px}
.track{position:absolute;left:0;bottom:0;height:100%;width:200%;display:flex;animation:drift 18s linear infinite}
.track svg{width:50%;height:100%;flex:none}
.track path{fill:currentColor}
.track.w1{color:var(--accent);opacity:.30}
.track.w2{color:var(--accent);opacity:.18;animation-duration:26s;animation-direction:reverse}
.track.w3{color:var(--wave-2);opacity:.20;animation-duration:22s}
@keyframes drift{to{transform:translateX(-50%)}}
.pro-hero .track{color:var(--accent-ink);opacity:.16}
.pro-hero .track.w2{opacity:.10}

/* ---------- Anel de nota ---------- */
.ring-wrap{position:relative;flex:none;width:var(--s);height:var(--s);display:grid;place-items:center}
.ring-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring-n{position:relative;font:800 var(--fs,44px)/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--text)}
.ring-arc{animation:arc 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes arc{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--o)}}

/* ---------- Tab bar ---------- */
.tabbar{
  position:fixed;z-index:35;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;
  padding:6px 10px calc(env(safe-area-inset-bottom) + 8px);
  background:var(--nav);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--border);
}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;border-radius:16px;font:600 11px/1 Inter,system-ui,sans-serif;color:var(--text-2)}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--accent)}
.tpro{position:absolute;top:4px;left:calc(50% + 6px);padding:2px 4px;border-radius:6px;background:var(--coral);color:#fff;font:800 8px/1 Inter,system-ui,sans-serif;letter-spacing:.06em}

/* ---------- Hoje ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.brand{display:flex;align-items:center;gap:8px;font:800 20px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em}
.brand .ic{color:var(--accent);width:24px;height:24px}
.hoje-head{padding:16px 0 4px}
.hoje-head h1{margin:14px 0 6px;font-size:32px;line-height:1.05;letter-spacing:-.025em}
.local{margin-top:2px;color:var(--text-2);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.dotsep{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.days{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:4px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,#000 84%,transparent);mask-image:linear-gradient(90deg,#000 84%,transparent)}
.days::-webkit-scrollbar{display:none}
.day{
  flex:none;width:66px;min-height:72px;border-radius:18px;background:var(--surface);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;
  font-size:11px;color:var(--text-2);
}
.day b{font:800 19px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--text)}
.day.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.day.on b{color:var(--accent-ink)}
.day .lk{position:absolute;top:7px;right:7px;width:14px;height:14px;color:var(--coral)}
.day .pro{font:700 10px/1 Inter,system-ui,sans-serif;letter-spacing:.1em;color:var(--coral)}

.hero{
  margin-top:20px;padding:18px;
  background:radial-gradient(120% 90% at 100% 0%,var(--hc-a,rgba(46,230,197,.2)) 0%,transparent 62%),var(--surface);
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero-main{display:flex;align-items:center;gap:18px;margin-top:14px}
.hero-txt{min-width:0;flex:1}
.hero h3{font-size:26px;line-height:1.1;letter-spacing:-.02em;margin-top:8px}
.sub{margin-top:4px;color:var(--text-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.mt{background:var(--surface-2);border-radius:14px;padding:10px 8px;min-width:0}
.mt .ic{width:16px;height:16px;color:var(--accent)}
.mt b{display:block;margin-top:6px;font:700 15px/1.1 "Bricolage Grotesque",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt small{display:block;margin-top:2px;font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.janela{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;font-weight:600;min-width:0}
.janela .ic{color:var(--accent)}
.btn-link{display:inline-flex;align-items:center;gap:4px;margin-top:10px;min-height:44px;font:600 15px Inter,system-ui,sans-serif;color:var(--accent)}
.btn-link .ic{width:18px;height:18px}

.lista{display:grid;gap:10px;margin-top:4px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;min-height:80px;padding:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);transition:transform .15s ease;
}
.row:active{transform:scale(.985)}
.row .ring-wrap{--s:52px}
.info{flex:1;min-width:0}
.info h4{font-size:16px;line-height:1.2;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .sub{margin:2px 0 6px}
.spark{flex:none;width:72px;height:38px}
.oculto{
  width:100%;margin-top:14px;min-height:48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;border-radius:16px;border:1px dashed var(--border);color:var(--text-2);font:600 14px Inter,system-ui,sans-serif;
}
.oculto .ic{transition:transform .2s}
.oculto[aria-expanded="true"] .ic{transform:rotate(180deg)}
.motivos{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.motivos li{padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:13px;display:grid;gap:2px;min-width:0}
.motivos li span{color:var(--text-2);font-size:12px}
.vazio{padding:22px;text-align:center;color:var(--text-2)}

/* ---------- Botões ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 18px;border-radius:18px;font:700 16px/1 Inter,system-ui,sans-serif;text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 14px 28px -14px var(--accent)}
.btn-ghost{background:var(--surface);border:1px solid var(--border)}
.btn-sm{width:auto;min-height:44px;padding:0 16px;font-size:14px;border-radius:14px}

/* ---------- Mapa ---------- */
.mapa-head{padding:16px 0 4px}
.mapa-head h1{font-size:32px;line-height:1.05;letter-spacing:-.025em;margin:10px 0 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;background:var(--surface-2)}
.seg button{min-height:44px;padding:0 10px;border-radius:12px;font:600 14px/1.1 Inter,system-ui,sans-serif;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.seg .ic{width:18px;height:18px}
.mapa-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}
.mapa{
  position:relative;width:100%;aspect-ratio:4/5;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,var(--sea-a),var(--sea-b));border:1px solid var(--border);box-shadow:var(--shadow);
}
.mapa > svg{position:absolute;inset:0;width:100%;height:100%}
.mapa .terra{fill:var(--land)}
.mapa .costa{fill:none;stroke:var(--accent);stroke-opacity:.6;stroke-width:1.6px;vector-effect:non-scaling-stroke}
.mapa .aviso-ill{position:absolute;left:12px;top:12px}
.cid{position:absolute;transform:translate(-50%,-50%);font:600 10px/1 Inter,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);white-space:nowrap;pointer-events:none;opacity:.9}
.pin{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;isolation:isolate}
.pin .bolha{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--bg);
  font:800 13px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink-pill);box-shadow:0 6px 16px rgba(0,0,0,.25);transition:transform .2s;
}
.pin[aria-pressed="true"] .bolha{transform:scale(1.14)}
.pin.best::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--pc);opacity:.55;z-index:-1;animation:pulse 1.9s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.6}100%{transform:scale(2.3);opacity:0}}
.mini{
  position:absolute;left:10px;right:10px;bottom:10px;padding:14px;border-radius:20px;
  background:var(--bg);border:1px solid var(--border);box-shadow:var(--shadow);
}
.mini-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mini h4{font-size:17px;letter-spacing:-.01em}
.mini .sub{margin:2px 0 8px}
.mini-acoes{display:flex;gap:8px;margin-top:12px;align-items:center}
.mini-acoes .btn{flex:1}
.ico-btn{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--surface-2)}
.legenda{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;font-size:12px;color:var(--text-2)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:50%;display:inline-block}

/* ---------- Pro ---------- */
.pro-hero{
  position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 110px;margin-top:14px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--wave-2) 100%);color:var(--accent-ink);
}
.pro-hero .pill{background:rgba(255,255,255,.2);color:inherit;border:1px solid rgba(255,255,255,.3);letter-spacing:.06em}
.pro-hero h2{font-size:28px;line-height:1.08;letter-spacing:-.02em;margin:14px 0 8px;position:relative}
.pro-hero p{font-size:14px;opacity:.92;position:relative;max-width:34ch}
.pro-hero .ondas{color:var(--accent-ink)}
.ben-list{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.ben{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.ben .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.ben b{display:block;font-size:15px;font-weight:600}
.ben span{font-size:13px;color:var(--text-2)}
.previa{position:relative;display:grid;gap:10px;margin-top:20px}
.previa-card{padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.previa-card .bl{filter:blur(3.5px);user-select:none;font-size:14px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.previa-card .lk{display:flex;align-items:center;gap:6px;font:700 12px/1 Inter,system-ui,sans-serif;color:var(--coral);white-space:nowrap}
.previa-card .lk .ic{width:14px;height:14px}
.planos{display:grid;gap:10px;margin-top:20px}
.plano{
  display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:14px 16px;border-radius:18px;
  background:var(--surface);border:2px solid var(--border);text-align:left;
}
.plano[aria-checked="true"]{border-color:var(--accent)}
.plano .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--text-2);flex:none;display:grid;place-items:center}
.plano[aria-checked="true"] .radio{border-color:var(--accent)}
.plano[aria-checked="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.plano .p-txt{flex:1;min-width:0}
.plano .p-txt b{display:block;font-size:15px}
.plano .p-txt span{font-size:12px;color:var(--text-2)}
.plano .p-val{font:800 19px/1 "Bricolage Grotesque",system-ui,sans-serif;white-space:nowrap}
.economia{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 10px/1 Inter,system-ui,sans-serif;vertical-align:middle}
.legal{font-size:12px;color:var(--text-2);text-align:center;margin-top:12px}
.sheet-x{position:absolute;top:14px;right:14px;z-index:2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.18);color:inherit}
.grab{width:44px;height:5px;border-radius:3px;background:var(--text-2);opacity:.5;margin:8px auto 10px}

/* ---------- Perfil ---------- */
.nv-opts{display:grid;gap:8px;margin-top:10px}
.nv-opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 12px;border-radius:16px;border:2px solid var(--border);background:var(--surface-2);text-align:left}
.nv-opt[aria-pressed="true"]{border-color:var(--accent)}
.nv-opt .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--accent);flex:none}
.nv-opt b{display:block;font-size:15px}
.nv-opt span{font-size:12px;color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);font:600 14px Inter,system-ui,sans-serif}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.perfil-seg{margin-top:12px}
.sobre p{font-size:14px;color:var(--text-2);margin-top:6px}

/* ---------- Ficha ---------- */
.layer{
  position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  overflow:hidden;z-index:40;pointer-events:none;
}
.layer.open{pointer-events:auto}
.panel{
  position:absolute;inset:0;background:var(--bg);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  transform:translateX(100%);visibility:hidden;
  transition:transform .3s cubic-bezier(.2,.7,.2,1),visibility 0s linear .3s;
}
.layer.open .panel{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.7,.2,1),visibility 0s}
.spot-top{position:relative;padding:calc(env(safe-area-inset-top) + 8px) 16px 20px;background:linear-gradient(180deg,var(--hc-a,rgba(46,230,197,.2)) 0,transparent 100%)}
.voltar{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 12px 0 4px;margin-left:-6px;font:600 15px Inter,system-ui,sans-serif}
.spot-head{display:flex;align-items:center;gap:16px;margin-top:6px;min-width:0}
.spot-head .sh-txt{min-width:0;flex:1}
.spot-head h1{font-size:30px;line-height:1.05;letter-spacing:-.025em;margin:10px 0 4px}
.spot-desc{margin-top:14px;font-size:14px;color:var(--text)}
.badge-modelo{display:inline-flex;align-items:center;gap:6px;margin-top:14px;min-height:30px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px dashed var(--coral);color:var(--coral);font:700 12px/1 Inter,system-ui,sans-serif}
.aviso-ficha{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-size:13px;display:flex;gap:10px;align-items:flex-start}
.aviso-ficha .ic{color:var(--coral)}
.spot-body{display:grid;gap:14px;padding:0 16px calc(env(safe-area-inset-bottom) + 28px)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h span{font-size:12px;color:var(--text-2);text-align:right}
.crit{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--border)}
.crit:first-of-type{border-top:0;padding-top:0}
.crit-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.crit-h em{font-style:normal;font-weight:500;color:var(--text-2);font-size:12px;margin-left:6px}
.crit-h b{font:800 17px/1 "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.crit p{font-size:12.5px;color:var(--text-2)}
.formula{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-2)}
.chart svg,.mare svg{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--text-2);font:600 11px Inter,system-ui,sans-serif}
.chart text.now{fill:var(--text);font-weight:800}
.mare text{fill:var(--text-2);font:600 11px Inter,system-ui,sans-serif}
.plano .p-txt .economia{color:var(--accent-ink);font-size:10px;font-weight:700;background:var(--accent);padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.janela-tag{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);font:600 12px/1 Inter,system-ui,sans-serif;white-space:nowrap}
.janela-tag .ic{width:14px;height:14px;color:var(--accent)}
.mare-info{display:grid;gap:6px;margin-top:10px;font-size:13px}
.mare-info div{display:flex;align-items:center;gap:8px}
.mare-info .ic{width:16px;height:16px;color:var(--accent)}
.wrow{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.wrow::-webkit-scrollbar{display:none}
.wi{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:16px;background:var(--surface-2);font-size:12px;color:var(--text-2)}
.wi b{font:700 13px/1 Inter,system-ui,sans-serif;color:var(--text);white-space:nowrap}
.wi .arrow{width:24px;height:24px;color:var(--accent);transform-origin:50% 50%}
.wi.now{outline:2px solid var(--accent);outline-offset:-2px;color:var(--text)}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:14px 14px}
.ft div{min-width:0}
.ft dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.ft dd{margin:4px 0 0;font-weight:600;font-size:14px;line-height:1.3}
.ft .full{grid-column:1/-1}
.riscos{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.riscos li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.riscos .ic{color:var(--coral);width:18px;height:18px;margin-top:1px}

/* ---------- Sheet (Pro) ---------- */
.sheet-layer{z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;overscroll-behavior:contain;
  border-radius:28px 28px 0 0;background:var(--bg);border-top:1px solid var(--border);
  transform:translateY(104%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s linear .32s;
  padding:0 16px calc(env(safe-area-inset-bottom) + 22px);
}
.sheet-layer.open .scrim{opacity:1}
.sheet-layer.open .sheet{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s}
.sheet-inner{position:relative}

/* ---------- Onboarding ---------- */
.onb{
  position:fixed;inset:0;z-index:70;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--bg);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  padding:0 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:18px;
}
.onb[hidden]{display:none}
.onb-art{position:relative;height:230px;margin:0 -16px;padding-top:calc(env(safe-area-inset-top) + 28px);overflow:hidden;background:linear-gradient(180deg,var(--bg-2) 0%,var(--bg) 100%);text-align:center}
.onb-logo{position:relative;display:inline-flex;align-items:center;gap:10px;font:800 46px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em}
.onb-logo .ic{width:44px;height:44px;color:var(--accent)}
.onb-slogan{position:relative;margin-top:10px;font-size:16px;color:var(--text-2)}
.onb-art .ondas{position:absolute;left:0;right:0;bottom:-4px;margin:0;height:90px}
.onb h2{font-size:26px;line-height:1.12;letter-spacing:-.02em;margin-top:4px}
.onb-cards{display:grid;gap:10px}
.nv{display:flex;align-items:center;gap:14px;width:100%;min-height:92px;padding:14px;border-radius:22px;background:var(--surface);border:2px solid var(--border);text-align:left;box-shadow:var(--shadow)}
.nv[aria-checked="true"]{border-color:var(--accent);background:var(--surface-2)}
.nv .ico{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.nv[aria-checked="true"] .ico{background:var(--surface)}
.nv .ico svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nv b{display:block;font:700 18px/1.2 "Bricolage Grotesque",system-ui,sans-serif}
.nv span{display:block;margin-top:3px;font-size:13px;color:var(--text-2)}
.onb .btn{margin-top:4px}

/* ---------- Toast ---------- */
.toast{
  position:fixed;z-index:80;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);
  transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  max-width:calc(100% - 32px);padding:12px 16px;border-radius:16px;background:var(--text);color:var(--bg);
  font:600 14px/1.3 Inter,system-ui,sans-serif;text-align:center;box-shadow:var(--shadow);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Revisão 2 ---------- */
.hero .sub{white-space:normal;overflow:visible;text-overflow:clip}
.aviso-noite{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:9px 12px;border-radius:14px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text)}
.aviso-noite .ic{width:16px;height:16px;color:var(--accent)}
.resumo b{white-space:normal;overflow:visible;text-overflow:clip}
.mapa{aspect-ratio:auto;overflow:hidden}
.lideres line{vector-effect:non-scaling-stroke}
.pt{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--pc);border:2px solid var(--bg);z-index:2;pointer-events:none;box-sizing:border-box}
.pt.best::before{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--coral);animation:halo2 1.8s ease-out infinite;z-index:-1}
@keyframes halo2{0%{width:14px;height:14px;margin:-7px 0 0 -7px;opacity:.9}100%{width:28px;height:28px;margin:-14px 0 0 -14px;opacity:0}}
.pl{position:absolute;left:52%;right:8px;min-height:42px;display:flex;align-items:center;gap:8px;padding:3px 10px 3px 4px;border-radius:21px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);text-align:left;z-index:3;transform:translateY(0)}
.pl.best{border:2px solid var(--coral)}
.pl[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.pl .pn{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink-pill)}
.pl .pnome{font:600 12.5px/1.15 Inter,system-ui,sans-serif;color:var(--text);min-width:0}
.cid{font-size:10px}

/* ---------- Revisão 1: herói premium, ranking, mapa, perfil e alertas ---------- */
.hero{margin-top:20px;padding:0;background:linear-gradient(165deg,var(--hc-a,rgba(46,230,197,.2)) 0%,transparent 62%),var(--surface)}
.hero-body{position:relative;z-index:1;padding:18px}
.hero .track{color:var(--hc,var(--accent));opacity:.22}
.hero .ondas.abs{height:78px}
.hero-main{display:flex;align-items:center;gap:16px;margin-top:12px}
.hero-txt{min-width:0;flex:1}
.hero h3{font-size:22px;line-height:1.1;letter-spacing:-.02em;margin-top:8px}
.hero-why{margin-top:10px;font-size:13px;line-height:1.35;color:var(--text)}
.hspark{display:block;width:100%;height:auto;margin-top:14px;overflow:visible}
.hspark text{fill:var(--text-2);font:600 10px Inter,system-ui,sans-serif}
.hspark text.now{fill:var(--text);font-weight:800}
.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
.mt{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center;padding:12px}
.mt .ic{grid-row:span 2;width:18px;height:18px}
.mt b{margin-top:0}
.mt small{margin-top:3px}
.rcol{flex:none;display:grid;justify-items:center;gap:6px;width:64px}
.rot{font:700 11px/1 Inter,system-ui,sans-serif;color:var(--text-2);white-space:nowrap}
.tag.terral{color:var(--accent);background:var(--accent-soft)}
.tag.lateral{color:var(--amber-ink);background:var(--amber-soft)}
.tag.maral{color:var(--coral);background:var(--coral-soft)}
.lista.fade{animation:listIn .4s ease-out both}
@keyframes listIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pin.best::before{content:"";position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--coral);z-index:-1;animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{width:28px;height:28px;margin:-14px 0 0 -14px;opacity:.8}100%{width:52px;height:52px;margin:-26px 0 0 -26px;opacity:0}}
.cid{transform:translate(-100%,-50%);z-index:1;text-align:right}
.pin{z-index:2}
.lideres{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.lideres line{stroke:var(--text-2);stroke-width:1;opacity:.8}
.mini{position:relative;left:auto;right:auto;bottom:auto;margin-top:12px}
.resumo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.resumo div:first-child{grid-column:1/-1}
.resumo div{min-width:0}
.resumo b{display:block;margin-top:6px;font:800 19px/1.1 "Bricolage Grotesque",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resumo span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.rodape{margin-top:18px;text-align:center;font-size:12px;color:var(--text-2)}
.conta{margin-top:8px;padding:9px 11px;border-radius:12px;background:var(--surface-2);color:var(--text);font-weight:600;font-size:13px}
.crit.pot .crit-h b small{font-size:12px;font-weight:600;color:var(--text-2)}
.lista{grid-template-columns:minmax(0,1fr)}
.row{min-width:0}
.info{min-width:0}
.tags{min-width:0}
.chart text.band{fill:var(--accent);font:700 10px Inter,system-ui,sans-serif}

/* ---------- Revisão 3: modo Pro simulado ---------- */
.pro-pill{background:var(--accent);color:var(--accent-ink);min-height:22px;padding:0 8px;font:800 10px/1 Inter,system-ui,sans-serif;letter-spacing:.08em}
.brand .pro-pill{margin-left:2px}
.previsao-dia{margin:0 2px 12px;font-size:13px;color:var(--text-2)}
.row-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;align-self:stretch;cursor:pointer}
.rside{flex:none;display:grid;justify-items:center;gap:4px;width:72px}
.fav-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;color:var(--text-2)}
.fav-btn .ic{width:20px;height:20px}
.fav-btn[aria-pressed="true"]{color:var(--amber)}
.fav-btn[aria-pressed="true"] .ic{fill:currentColor}
.spot-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.spot-nav .fav-btn{margin-right:-10px}
.tag.fav{color:var(--amber-ink);background:var(--amber-soft)}
.chev{width:18px;height:18px;color:var(--text-2)}
.plano-card .btn-sm{margin-top:12px}
.alertas{display:grid;gap:10px}
.alerta{padding:16px}
.alerta h3{font-size:18px;line-height:1.2;letter-spacing:-.01em}
.alerta.off h3{color:var(--text-2)}
.alerta-top{display:flex;align-items:center;gap:6px;min-width:0}
.alerta-nome{flex:1;min-width:0}
.alerta-nome .sub{margin:2px 0 0}
.alerta-min{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px;color:var(--text-2)}
.alerta-status{margin-top:12px;font-size:13px;color:var(--text-2)}
.switch{flex:none;width:56px;min-height:44px;display:flex;align-items:center;justify-content:center}
.switch i{position:relative;display:block;width:48px;height:28px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text-2);transition:transform .2s,background .2s}
.switch[aria-checked="true"] i{background:var(--accent);border-color:transparent}
.switch[aria-checked="true"] i::after{transform:translateX(20px);background:var(--accent-ink)}
.stepper{flex:none;display:flex;align-items:center;gap:4px;padding:3px;border-radius:16px;background:var(--surface-2)}
.stepper button{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--text);font:700 20px/1 Inter,system-ui,sans-serif}
.stepper b{min-width:50px;text-align:center;font:800 18px/1 "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--text)}
.alvo{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 12px;margin-top:8px;border-radius:18px;background:var(--surface);border:1px solid var(--border);text-align:left;cursor:pointer}
.alvo .info{flex:1;min-width:0}
.alvo .ic{color:var(--accent)}
.sheet-head h2{margin-top:6px;font-size:24px;line-height:1.15;letter-spacing:-.02em}
.sheet-head .hint{margin:6px 0 14px}
.boas{position:fixed;inset:0;z-index:72;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(env(safe-area-inset-bottom) + 24px);background:var(--bg);overflow-y:auto}
.boas[hidden]{display:none}
.boas-in{display:grid;justify-items:center;gap:14px;max-width:340px;text-align:center}
.boas-ico{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent) 0%,var(--wave-2) 100%);color:var(--accent-ink);box-shadow:0 18px 36px -16px var(--accent);animation:boasIn .5s cubic-bezier(.2,.7,.2,1) both}
.boas-ico .ic{width:46px;height:46px;stroke-width:2.6}
.boas h2{font-size:28px;line-height:1.08;letter-spacing:-.02em}
.boas p{font-size:14px;color:var(--text-2)}
.boas .btn{margin-top:8px}
@keyframes boasIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ================= Previsão fake (determinística, mulberry32 seed 42) ================= */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mareRaw(t){ return 0.8 + 0.7 * Math.sin(TAU * (t - 3) / 12.42); }

/* R1.2: previsão com dois ciclos de altura regional (70 h e 23 h) e terral que gira por dia.
   Ajuste de calibração (R1.5) aplicado nas constantes desta função, sem tocar pesos nem fórmula da nota. */
function buildHourly(){
  var rnd = mulberry32(42);
  var out = [];
  for (var t = 0; t < 168; t++){
    var rA = (rnd() * 2 - 1) * 0.12;
    var rP = (rnd() * 2 - 1) * 0.6;
    var rV = rnd() * 2 - 1;
    var rD = rnd() * 2 - 1;
    var dia = Math.floor(t / 24);
    var regional = Math.max(0.2, 1.0 + 0.6 * Math.sin(TAU * t / 70) + 0.3 * Math.sin(TAU * t / 23) + rA);
    regional = round1(regional);
    var periodo = round1(10 + 2.5 * Math.sin(TAU * t / 90 + 1) + rP);
    var swellDir = Math.round(130 + 35 * Math.sin(TAU * t / 110));
    var h = t % 24, ventoDir, ventoVel;
    if (h >= 4 && h <= 10){            // terral da manhã, direção muda por dia
      ventoDir = 265 + 25 * Math.sin(TAU * dia / 5) + rD * 8;
      ventoVel = 5 + (rV + 1) / 2 * 7;
    } else if (h >= 11 && h <= 18){    // nordeste da tarde
      ventoDir = 45 + rD * 8;
      ventoVel = h === 15 ? 24 + (rV + 1) / 2 * 6 : 15 + (rV + 1) / 2 * 15;
    } else {                           // noite
      ventoDir = 20 + rD * 8;
      ventoVel = 8 + (rV + 1) / 2 * 6;
    }
    ventoDir = Math.round((ventoDir + 360) % 360);
    ventoVel = Math.round(ventoVel);
    var m = round2(Math.min(1.5, Math.max(0.1, mareRaw(t))));
    var mNext = round2(mareRaw(t + 1));
    out.push({
      regional: regional, periodo: periodo, swellDir: swellDir,
      ventoVel: ventoVel, ventoDir: ventoDir,
      mare: m, mareFase: mNext > m ? 'enchendo' : 'secando'
    });
  }
  return out;
}
/* R1.2: fator de direção. Ondulação que não entra de frente na praia chega menor. */
function fatorDir(sp, swellDir){
  return Math.max(0.25, Math.cos(angDiff(swellDir, sp.orientacao) * Math.PI / 180));
}
var HOURLY = buildHourly();

var FORECAST = {};
SPOTS.forEach(function(sp){

      fator: fatorDir(sp, hr.swellDir),
      periodo: hr.periodo, swellDir: hr.swellDir,
      ventoVel: hr.ventoVel, ventoDir: hr.ventoDir,
      mare: hr.mare, mareFase: hr.mareFase
    };

});

/* ================= Cálculo da nota (SPEC) ================= */
function angDiff(a, b){
  var d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}
function cardinal(d){
  var n = ((d % 360) + 360) % 360;
  return CARD[Math.round(n / 22.5) % 16];
}
function bandaDe(m){ return m < 0.55 ? 'baixa' : (m <= 1.05 ? 'media' : 'alta'); }
function tipoVento(vel, dir, terral){
  if (vel < 6) return 'calmo';
  var d = angDiff(dir, terral);
  if (d <= 45) return 'terral';
  if (d <= 100) return 'lateral';
  return 'maral';
}

/* Textos do potencial (R1.4) */
function textoPotencial(p){
  if (p >= 0.9) return 'pico de forma, com boa parede';
  if (p >= 0.75) return 'pico consistente, de boa forma';
  if (p >= 0.6) return 'praia de ondas pequenas, mesmo perfeita';
  return 'praia abrigada, de ondas pequenas';
}

/* R1.3 e R1.4: componentes menos saturados, nota = 10 * base * potencial, com tetos. */
function avaliar(sp, f){
  var alt = f.altura, per = f.periodo;
  var c = {}, tx = {};

  // tamanho
  var T = sp.tamanho, cT = (T.min + T.max) / 2, mT = (T.max - T.min) / 2;
  var dentroT = alt >= T.min && alt <= T.max;
  if (dentroT) c.tamanho = 1 - 0.35 * Math.abs(alt - cT) / mT;
  else if (alt < T.min) c.tamanho = 0.65 * alt / T.min;
  else c.tamanho = Math.max(0, 0.65 * (1 - (alt - T.max) / T.max));
  tx.tamanho = fmt1(alt) + ' m · ' + (dentroT ? 'dentro do ideal' : (alt < T.min ? 'abaixo do ideal' : 'acima do ideal')) +
    ' (' + fmt1(T.min) + '–' + fmt1(T.max) + ' m)';

  // direção
  var S_ = sp.swellIdeal, dd = angDiff(f.swellDir, S_.dir), tol = S_.tol;
  if (dd <= tol / 2) c.direcao = 1;
  else if (dd <= tol) c.direcao = 1 - 0.3 * (dd - tol / 2) / (tol / 2);
  else if (dd < tol + 45) c.direcao = 0.7 * (1 - (dd - tol) / 45);
  else c.direcao = 0;
  tx.direcao = 'Ondulação ' + cardinal(f.swellDir) + ' · ' +
    (dd <= tol ? 'dentro do ideal' : Math.round(dd) + '° fora do ideal') + ' (ideal ' + cardinal(S_.dir) + ')';

  // período
  var P = sp.periodoIdeal, cP = (P.min + P.max) / 2, mP = (P.max - P.min) / 2;
  var dentroP = per >= P.min && per <= P.max;
  if (dentroP) c.periodo = 1 - 0.25 * Math.abs(per - cP) / mP;
  else if (per < P.min) c.periodo = 0.75 * Math.max(0, 1 - (P.min - per) / 4);
  else c.periodo = 0.75 * Math.max(0, 1 - (per - P.max) / 6);
  tx.periodo = fmt1(per) + ' s · ' + (dentroP ? 'dentro do ideal' : (per < P.min ? 'curto' : 'longo')) +
    ' (' + P.min + '–' + P.max + ' s)';

  // vento
  var vel = f.ventoVel, vd = f.ventoDir;
  var tipo = tipoVento(vel, vd, sp.ventoTerral);
  if (vel < 6) c.vento = 0.95;
  else {
    var dv = angDiff(vd, sp.ventoTerral);
    if (dv <= 45) c.vento = 1;
    else if (dv <= 100) c.vento = 0.55 * (1 - Math.min(vel, 35) / 50);
    else c.vento = 0.25 * (1 - Math.min(vel, 35) / 50);
  }
  tx.vento = 'Vento ' + cardinal(vd) + ' ' + vel + ' km/h · ' + TIPO_NOME[tipo].toLowerCase();

  // maré
  var M = sp.mareIdeal;
  var ab = BANDAS.indexOf(bandaDe(f.mare));
  var ib = BANDAS.indexOf(M.nivel);
  var diff = Math.abs(ab - ib);
  var base0 = diff === 0 ? 1 : (diff === 1 ? 0.5 : 0.1);
  var fator = (M.fase !== 'qualquer' && M.fase !== f.mareFase) ? 0.8 : 1;
  c.mare = base0 * fator;
  tx.mare = 'Maré ' + BANDA_NOME[BANDAS[ab]] + ' ' + f.mareFase + ' · ' +
    (diff === 0 ? 'ideal' : (diff === 1 ? 'faixa vizinha' : 'faixa oposta')) +
    (fator < 1 ? ', pede ' + M.fase : '');

  // encaixe (base 0..1)
  var base = 0;
  Object.keys(PESOS).forEach(function(k){
    c[k] = Math.min(1, Math.max(0, c[k]));
    base += PESOS[k] * c[k];
  });
  var pot = sp.potencial;
  var prec = round1(10 * base * pot);          // antes dos tetos
  var nota = 10 * base * pot, teto = '';
  // abaixo do tamanho mínimo em que o pico funciona, não passa de Regular (ajuste do orquestrador, Revisão 3)
  if (alt < sp.tamanho.min && nota > 5.9){ nota = 5.9; teto = 'abaixo do mínimo do pico'; }
  if (alt < 0.6){ if (nota > 5){ nota = 5; teto = 'marola'; } }
  if (alt < 0.3){ if (nota > 1.5){ nota = 1.5; teto = 'flat'; } }
  if (nota >= 9 && (alt < 1.2 || per < 10)){ nota = 8.9; teto = 'mar pequeno ou período curto'; }
  // R2.1: vento maral/lateral forte estraga o mar
  var ventoCap = false, ventoTxt = '';
  // Teto proporcional ao encaixe (3,5 a 5,5) para não empatar todos os picos no mesmo valor.
  var capVento = round1(3.5 + 2 * base);
  if (c.vento < 0.30 && nota > capVento){
    nota = capVento; ventoCap = true;
    ventoTxt = (tipo === 'maral' ? 'Vento maral forte' : 'Vento lateral forte') + ' limita a nota a ' + String(capVento).replace('.', ',');
    teto = 'vento ' + (tipo === 'maral' ? 'maral' : 'lateral') + ' forte';
  }
  nota = Math.min(10, Math.max(0, round1(nota)));
  return {
    nota: nota, prec: prec, teto: teto, base: base, potencial: pot,
    c: c, tx: tx, tipo: tipo, vel: vel, vd: vd, alt: alt, mare: f.mare, fase: f.mareFase,
    periodo: per, swellDir: f.swellDir, encaixe: Math.round(base * 100),
    fator: f.fator, ventoCap: ventoCap, ventoTxt: ventoTxt,
    txPot: textoPotencial(pot)
  };
}

/* Melhor janela de 3 h entre 5h e 18h (dia 0) */
function melhorJanela(id, base){
  var N = SCORE[id], best = null, b0 = base || 0;
  for (var s = 5; s <= 15; s++){
    var media = (N[b0 + s].nota + N[b0 + s + 1].nota + N[b0 + s + 2].nota) / 3;
    if (!best || media > best.raw + 1e-9) best = { ini: s, fim: s + 3, raw: media, media: round1(media) };
  }
  return best;
}

/* Filtro por nível */

function motivoOculto(sp, t, nivel){
  var alt = FORECAST[sp.id][t].altura;
  if (rankNivel(nivel) < rankNivel(sp.nivel)) return 'Pico para nível ' + NIVEL_NOME[sp.nivel].toLowerCase();
  if (nivel === 'iniciante' && FUNDOS_RASOS.indexOf(sp.fundo) >= 0 && alt > 1.2)
    return 'Fundo de ' + (sp.fundo === 'laje' ? 'laje' : 'pedra') + ' com mar acima de 1,2 m';
  if (nivel === 'iniciante' && alt > 1.8) return 'Mar acima de 1,8 m para iniciantes';
  if (nivel === 'intermediario' && sp.fundo === 'laje' && alt > 2.5) return 'Laje com mar acima de 2,5 m';

}

/* R2.2: hora de referência. Sem luz (antes das 5h ou depois das 18h), usa a melhor hora de 5h a 11h. */
function melhorHoraEntre(a, b){
  var best = -1, bestH = a;
  for (var h = a; h <= b; h++){
    var vs = visiveis(h, S.nivel, S.regiao);
    var top = vs.length ? vs[0].s.nota : -1;
    if (top > best){ best = top; bestH = h; }
  }
  return bestH;
}
/* R3.3: dia > 0 (só Pro) usa a melhor hora entre 5h e 18h daquele dia. Dia 0 segue a regra acima. */
function setRef(){
  var hr = S.hora, d = S.pro ? S.dia : 0;
  S.refDia = null;
  if (d > 0){
    S.ref = melhorHoraEntre(d * 24 + 5, d * 24 + 18); S.night = false; S.refWhen = null; S.refDia = diaTxt(d);
  } else if (hr < 5){
    S.ref = melhorHoraEntre(5, 11); S.night = true; S.refWhen = 'hoje';
  } else if (hr > 18){
    S.ref = melhorHoraEntre(29, 35); S.night = true; S.refWhen = 'amanhã';
  } else {
    S.ref = hr; S.night = false; S.refWhen = null;
  }
  S.base = Math.floor(S.ref / 24) * 24;   // início do dia da referência
  S.hd = S.ref % 24;                       // hora do dia da referência
}

/* R2.4: linha "por quê" com os 2 componentes mais fortes e o mais fraco (se < 0,6). */
function fraseForte(k, sc, sp){
  var f = sc;
  if (k === 'tamanho') return sc.c.tamanho >= 0.8 ? 'tamanho ideal' : 'tamanho razoável';
  if (k === 'direcao') return sc.fator >= 0.85 ? 'ondulação entrando de frente' : (sc.fator >= 0.55 ? 'ondulação entrando na diagonal' : 'ondulação entrando de lado');
  if (k === 'periodo') return 'período de ' + fmt1(sc.periodo) + ' s';
  if (k === 'vento') return sc.tipo === 'terral' ? 'terral limpo' : (sc.tipo === 'lateral' ? 'vento lateral' : (sc.tipo === 'maral' ? 'vento de maral' : 'mar sem vento'));
  if (k === 'mare') return 'maré ' + sc.fase + (sc.c.mare >= 0.8 ? ' no ponto' : '');
  return k;
}
function fraseFraca(k, sc, sp){
  if (k === 'tamanho') return sc.alt < sp.tamanho.min ? 'mar pequeno demais' : 'mar grande demais';
  if (k === 'direcao') return 'ondulação de lado';
  if (k === 'periodo') return 'período fora do ideal';
  if (k === 'vento') return (sc.tipo === 'maral' || sc.tipo === 'lateral') ? 'vento contra' : 'vento fraco';
  if (k === 'mare') return 'maré contra';
  return k;
}
function porQue(sc, sp){
  var keys = Object.keys(sc.c).sort(function(a, b){ return sc.c[b] - sc.c[a]; });
  var out = fraseForte(keys[0], sc, sp) + ' + ' + fraseForte(keys[1], sc, sp);
  var last = keys[keys.length - 1];
  if (sc.c[last] < 0.6) out += ' · ' + fraseFraca(last, sc, sp);
  return out.charAt(0).toUpperCase() + out.slice(1);
}

var VIEWS = {
  estado: { lonMin: -41.5, w: 3.6, latMax: -18.0, h: 5.0 },
  gv: { lonMin: -40.48, w: 0.8, latMax: -19.85, h: 1.0 }
};
var CIDADES = [['Vitória', -20.30], ['Vila Velha', -20.42], ['Serra', -20.13], ['Guarapari', -20.66], ['Linhares', -19.40]];
var PITCH = 46, PAD = 20, HMIN = 448, PILL_X = 52;
function proj(v, lon, lat){ return { x: (lon - v.lonMin) / v.w * 100, y: (v.latMax - lat) / v.h }; }   // y em fração da altura
function costaEm(lat){
  for (var i = 0; i < COSTA.length - 1; i++){
    var a = COSTA[i], b = COSTA[i + 1];
    if (a[1] >= lat && lat >= b[1]){
      var t = (a[1] - lat) / (a[1] - b[1]);
      return a[0] + (b[0] - a[0]) * t;
    }
  }
  return COSTA[COSTA.length - 1][0];
}
function mapaSVG(v){
  var vb = v.lonMin + ' ' + (-v.latMax) + ' ' + v.w + ' ' + v.h;
  var poly = [[-39.6, -17.5]].concat(COSTA, [[-40.95, -21.8], [-50, -21.8], [-50, -17.5]]);
  var terra = 'M' + poly.map(function(p){ return p[0] + ' ' + (-p[1]); }).join(' L') + ' Z';
  var costa = 'M' + COSTA.map(function(p){ return p[0] + ' ' + (-p[1]); }).join(' L');
  return '<svg viewBox="' + vb + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path class="terra" d="' + terra + '"/><path class="costa" d="' + costa + '"/></svg>';
}
function vMapa(){
  var t = S.ref, v = VIEWS[S.mapa] || VIEWS.estado;
  var lst = visiveis(t, S.nivel, S.regiao);
  var best = lst[0];
  // pontos dentro da área útil: fora da margem vertical e à esquerda da coluna de pílulas
  var inV = lst.filter(function(x){
    var p = proj(v, x.spot.lon, x.spot.lat);
    return p.y >= 0.03 && p.y <= 0.97 && p.x >= 6.5 && p.x <= PILL_X - 2;
  });
  var order = inV.slice().sort(function(a, b){ return b.spot.lat - a.spot.lat; });  // norte para sul
  var n = order.length;
  var H = Math.max(HMIN, n * PITCH + 2 * PAD);
  var lines = '', dots = '', pills = '';
  order.forEach(function(x, i){
    var p = proj(v, x.spot.lon, x.spot.lat), isBest = best && x.spot.id === best.spot.id;
    var py = p.y * H, top = PAD + i * PITCH, cy = top + PITCH / 2 - 2;
    var n1 = fmt1(x.s.nota);
    lines += '<line x1="' + p.x.toFixed(2) + '" y1="' + py.toFixed(1) + '" x2="' + PILL_X + '" y2="' + cy.toFixed(1) + '"/>';
    dots += '<span class="pt' + (isBest ? ' best' : '') + '" style="left:' + p.x.toFixed(2) + '%;top:' + py.toFixed(1) + 'px;--pc:' + corNota(x.s.nota) + '"></span>';
    pills += '<button class="pl' + (isBest ? ' best' : '') + '" style="top:' + top + 'px;height:' + (PITCH - 4) + 'px" data-act="pin" data-id="' + x.spot.id + '" aria-pressed="' + (S.pin === x.spot.id) + '" aria-label="' + esc(x.spot.nome) + ', nota ' + n1 + '">' +
      '<span class="pn" style="background:' + pillBg(x.s.nota) + '">' + n1 + '</span><span class="pnome">' + esc(x.spot.nome) + '</span></button>';
  });
  var cids = '';
  CIDADES.forEach(function(c){
    var lon = costaEm(c[1]), p = proj(v, lon, c[1]);
    if (p.y < 0.02 || p.y > 0.98) return;
    var xpx = p.x / 100 * 358;
    if (xpx - 22 - c[0].length * 7.5 < 12) return;   // margem mínima de 12 px à esquerda
    cids += '<span class="cid" style="left:calc(' + p.x.toFixed(2) + '% - 22px);top:' + (p.y * H).toFixed(1) + 'px">' + esc(c[0]) + '</span>';
  });
  var pinned = S.pin ? lst.filter(function(x){ return x.spot.id === S.pin; })[0] : null;
  var leg = [['Fraco', '#FF6B5B', '0–3,9'], ['Regular', '#FFB547', '4–5,9'], ['Bom', '#C6E85A', '6–7,4'],
    ['Muito bom', '#3EE0B5', '7,5–8,9'], ['Clássico', 'linear-gradient(90deg,#3EE0B5,#5AA9FF)', '9–10']];
  var rotuloMapa = S.night ? 'Previsão para ' + S.refWhen + ' às ' + S.hd + 'h'
    : (S.refDia ? 'Previsão para ' + S.refDia + ' às ' + S.hd + 'h' : 'Agora · ' + S.hora + 'h');
  return '<header class="mapa-head"><p class="eyebrow">' + rotuloMapa + '</p><h1>Mapa dos picos</h1>' +
    '<p class="lead">Notas pico a pico, de norte para sul. ' + n + (n === 1 ? ' pico no mapa.' : ' picos no mapa.') + '</p></header>' +
    '<div class="seg" role="group" aria-label="Área do mapa" style="margin-top:14px">' +
      '<button data-act="mapa-modo" data-v="gv" aria-pressed="' + (S.mapa === 'gv') + '">Grande Vitória</button>' +
      '<button data-act="mapa-modo" data-v="estado" aria-pressed="' + (S.mapa !== 'gv') + '">Estado todo</button></div>' +
    '<div class="mapa" style="margin-top:14px;height:' + H + 'px">' + mapaSVG(v) +
      '<span class="chip aviso-ill">' + ico('i-map') + 'Mapa ilustrativo</span>' +
      '<svg class="lideres" viewBox="0 0 100 ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + lines + '</svg>' +
      cids + dots + pills + '</div>' +
    (pinned ? miniHTML(pinned) : '') +
    '<div class="legenda">' + leg.map(function(l){
      return '<span><i style="background:' + l[1] + '"></i>' + l[0] + ' · ' + l[2] + '</span>';
    }).join('') + '</div>';
}
function miniHTML(x){
  var sp = x.spot, s = x.s, f = FORECAST[sp.id][S.ref];
  return '<div class="mini">' +

/* ================= Ficha ================= */
function grafHoras(sp, base, jan, hd){
  var W = 330, base0 = 118, bw = 14, step = 22, out = '';
  var dy = 22;   // linha própria para o rótulo "Melhor janela"
  if (jan){
    out += '<rect x="' + ((jan.ini - 5) * step + 1) + '" y="' + dy + '" width="' + (3 * step - 2) + '" height="' + base0 + '" rx="8" style="fill:var(--accent);opacity:.14;stroke:var(--accent);stroke-width:1;stroke-opacity:.55"/>';
    out += '<text class="band" x="' + ((jan.ini - 5) * step + 6) + '" y="14">Melhor janela</text>';
  }
  out += '<g transform="translate(0,' + dy + ')">';
  out += '<line x1="0" x2="' + W + '" y1="' + base0 + '" y2="' + base0 + '" style="stroke:var(--border)" stroke-width="1"/>';
  for (var i = 0; i < 15; i++){
    var hh = 5 + i, n = SCORE[sp.id][base + hh].nota, bh = Math.max(4, n / 10 * base0), x = i * step + 4, y = base0 - bh, now = hh === hd;
    // a barra da hora atual é mais larga para o valor caber dentro dela
    var bx = now ? x - 3 : x, bwi = now ? bw + 6 : bw;
    out += '<rect x="' + bx + '" y="' + y.toFixed(1) + '" width="' + bwi + '" height="' + bh.toFixed(1) + '" rx="5" style="fill:' + corNota(n) + (now ? ';stroke:var(--text);stroke-width:2' : '') + '"/>';
    if (now) out += '<text class="now" x="' + (x + bw / 2) + '" y="' + (y + 14).toFixed(1) + '" text-anchor="middle" style="fill:#06201A;font-size:9px">' + fmt1(n) + '</text>';
    out += '<text class="' + (now ? 'now' : '') + '" x="' + (x + bw / 2) + '" y="' + (base0 + 18) + '" text-anchor="middle">' + hh + '</text>';
  }
  out += '</g>';
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + (dy + base0 + 24) + '" aria-label="Nota por hora, de 5h a 19h" role="img">' + out + '</svg></div>';
}
function grafMare(sp, base, t, hd){
  var W = 330, H = 140, top = 18, bot = 112;
  function yOf(m){ return bot - (m - 0.1) / 1.4 * (bot - top); }
  var pts = [], i;
  for (i = 0; i <= 96; i++){ var x = i / 4; pts.push([x / 24 * W, yOf(mareRaw(base + x))]); }
  var d = pts.map(function(p, k){ return (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var area = d + ' L' + W + ' ' + bot + ' L0 ' + bot + ' Z';
  var grid = [0, 6, 12, 18, 24].map(function(hh){
    var gx = hh / 24 * W;
    return '<line x1="' + gx + '" x2="' + gx + '" y1="' + top + '" y2="' + bot + '" style="stroke:var(--border)" stroke-width="1"/>' +
      '<text x="' + gx + '" y="' + (H - 2) + '" text-anchor="' + (hh === 0 ? 'start' : (hh === 24 ? 'end' : 'middle')) + '">' + hh + 'h</text>';
  }).join('');
  var f = FORECAST[sp.id][t], nx = hd / 24 * W, ny = yOf(f.mare);
  var smp = []; for (i = 0; i <= 480; i++){ var xx = i / 20; smp.push([xx, mareRaw(base + xx)]); }
  var ext = [];
  for (i = 1; i < smp.length - 1; i++){
    var a = smp[i - 1][1], b = smp[i][1], c = smp[i + 1][1];
    if (b > a && b >= c) ext.push({ tipo: 'Preamar', x: smp[i][0], m: b });
    else if (b < a && b <= c) ext.push({ tipo: 'Baixa-mar', x: smp[i][0], m: b });
  }
  var extTxt = ext.map(function(e){
    return '<div>' + ico('i-tide') + '<span>' + e.tipo + ' ' + hhmm(e.x) + ' · ' + fmt2(e.m) + ' m</span></div>';
  }).join('');
  return '<div class="mare"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Curva da maré de 0h a 24h">' + grid +
    '<path d="' + area + '" style="fill:var(--accent);opacity:.14"/>' +
    '<path d="' + d + '" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round"/>' +
    '<line x1="' + nx.toFixed(1) + '" x2="' + nx.toFixed(1) + '" y1="' + top + '" y2="' + bot + '" style="stroke:var(--text-2)" stroke-dasharray="3 3" stroke-width="1"/>' +
    '<circle cx="' + nx.toFixed(1) + '" cy="' + ny.toFixed(1) + '" r="6" style="fill:var(--accent);stroke:var(--bg)" stroke-width="3"/>' +
    '</svg><div class="mare-info"><div>' + ico('i-clock') + '<span>Às ' + hd + 'h: ' + fmt2(f.mare) + ' m, maré ' + f.mareFase + '</span></div>' + extTxt + '</div></div>';
}
function vFicha(sp){
  var t = S.ref, hd = S.hd, base = S.base, sc = SCORE[sp.id][t], cor = corNota(sc.nota), jan = melhorJanela(sp.id, base), motivo = motivoOculto(sp, t, S.nivel);
  var sw = sp.swellIdeal, PP = sp.periodoIdeal, T = sp.tamanho, M = sp.mareIdeal;
  var h = '<header class="spot-top" style="--hc:' + cor + ';--hc-a:' + hexA(cor, 0.3) + '">' +
    '<div class="spot-nav"><button class="voltar" data-act="spot-close" aria-label="Voltar">' + ico('i-back') + 'Voltar</button>' + favBtn(sp.id) + '</div>' +
    '<div class="spot-head">' + ring(sc.nota, 120, 40, 11) +
    '<div class="sh-txt"><span class="pill" style="background:' + pillBg(sc.nota) + '">' + rotuloNota(sc.nota) + '</span>' +
    '<h1>' + esc(sp.nome) + '</h1><p class="sub">' + esc(sp.cidade) + ' · ' + REGIOES[sp.regiao] + '</p></div></div>';
  if (sp.modelo) h += '<span class="badge-modelo">Ficha-modelo · em validação</span>';
  h += '<p class="hero-why spot-why">' + esc(porQue(sc, sp)) + '</p>';
  if (motivo) h += '<p class="aviso-ficha">' + ico('i-alert') + '<span>Oculto para o seu nível: ' + esc(motivo) + '.</span></p>';
  h += '<p class="spot-desc">' + esc(sp.descricao) + '</p></header>';

  h += '<div class="spot-body">';
  h += '<section class="card"><div class="card-h"><h2>Por que essa nota</h2><span>' + fmt1(sc.nota) + ' de 10 · ' + (S.night ? S.refWhen + ' ' : (S.refDia ? S.refDia + ' · ' : '')) + hd + 'h</span></div>';
  ORDEM_CRIT.forEach(function(kv){
    var k = kv[0], v = sc.c[k], pct = Math.round(v * 100);
    h += '<div class="crit"><div class="crit-h"><span>' + kv[1] + '<em>peso ' + Math.round(PESOS[k] * 100) + '%</em></span><b>' + pct + '%</b></div>' +
      '<div class="bar"><i style="width:' + pct + '%;background:' + corNota(v * 10) + '"></i></div><p>' + esc(sc.tx[k]) + '</p></div>';
  });
  var teto = sc.teto && sc.nota !== sc.prec ? ' → ' + fmt1(sc.nota) + ' (teto de ' + sc.teto + ')' : '';
  h += '<div class="crit pot"><div class="crit-h"><span>Potencial do pico</span><b>' + fmt1(sc.potencial * 10) + '<small> de 10</small></b></div>' +
    '<p>' + esc(sc.txPot) + '</p>' +
    '<p class="conta">Encaixe ' + sc.encaixe + '% × potencial ' + fmt2(sc.potencial) + ' = ' + fmt1(sc.prec) + teto + '</p></div>';
  if (sc.ventoCap) h += '<p class="aviso-ficha">' + ico('i-alert') + '<span>' + esc(sc.ventoTxt) + '</span></p>';
  h += '<p class="formula">Nota = 10 × encaixe (soma de peso × componente) × potencial do pico. Mar abaixo de 0,6 m limita a nota a 5,0.</p></section>';

  h += '<section class="card"><div class="card-h"><h2>Nota hora a hora</h2><span>' + (S.night ? S.refWhen : (S.refDia || 'hoje')) + ' · 5h–19h</span></div>';
  h += grafHoras(sp, base, jan, hd) + '</section>';

  h += '<section class="card"><div class="card-h"><h2>Maré</h2><span>' + BANDA_NOME[bandaDe(sc.mare)] + ' · ' + sc.fase + '</span></div>' + grafMare(sp, base, t, hd) + '</section>';

  h += '<section class="card"><div class="card-h"><h2>Vento</h2><span>setas: para onde o vento vai</span></div><div class="wrow">';
  for (var k2 = 0; k2 < 24; k2++){
    var fw = FORECAST[sp.id][base + k2];
    h += '<div class="wi' + (k2 === hd ? ' now' : '') + '"><span>' + k2 + 'h</span>' +
      '<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(' + fw.ventoDir + 'deg)"><use href="#i-arrow"/></svg>' +
      '<b>' + fw.ventoVel + '</b><small>km/h</small></div>';
  }
  h += '</div></section>';

  var ft = function(label, val, full){ return '<div' + (full ? ' class="full"' : '') + '><dt>' + label + '</dt><dd>' + esc(val) + '</dd></div>'; };
  h += '<section class="card"><h2 style="margin-bottom:14px">Ficha técnica</h2><dl class="ft">' +
    ft('Orientação', sp.orientacao + '° · ' + cardinal(sp.orientacao)) +
    ft('Fundo', cap(sp.fundo)) +
    ft('Ondulação ideal', cardinal(sw.dir) + ' (' + sw.dir + '° ±' + sw.tol + '°)') +
    ft('Período ideal', PP.min + '–' + PP.max + ' s') +
    ft('Tamanho ideal', fmt1(T.min) + '–' + fmt1(T.max) + ' m') +
    ft('Vento terral', cardinal(sp.ventoTerral) + ' (' + sp.ventoTerral + '°)') +
    ft('Maré ideal', cap(BANDA_NOME[M.nivel]) + ' · ' + (M.fase === 'qualquer' ? 'qualquer fase' : M.fase)) +
    ft('Nível mínimo', NIVEL_NOME[sp.nivel]) +
    ft('Distância', sp.distanciaKm + ' km · ' + sp.tempoCarroMin + ' min de carro') +
    ft('Acesso', sp.acesso, true) +
    '</dl><ul class="riscos">' + sp.riscos.map(function(r){ return '<li>' + ico('i-alert') + '<span>' + esc(r) + '</span></li>'; }).join('') + '</ul></section>';

  h += botaoAlerta(sp);
  h += '</div>';
  return h;
}

/* ================= Renderização ================= */
function renderOnb(){
  var el = $('#onb');
  el.hidden = !S.onb;
  el.innerHTML = S.onb ? vOnb() : '';
}
function renderBoas(){
  var el = $('#boas');
  if (!el) return;
  el.hidden = !S.boas;
  el.innerHTML = S.boas
    ? '<div class="boas-in"><div class="boas-ico">' + ico('i-check') + '</div>' +
      '<h2>Bem-vindo ao ' + APP + ' Pro</h2>' +
      '<p>Teste de 7 dias · simulado, nenhuma cobrança</p>' +
      '<button class="btn btn-primary" data-act="boas-close">Ver meus alertas</button></div>'
    : '';
}
function renderLayers(){
  var layer = $('#spot'), panel = $('#spot-panel');
  if (S.spot && SPOT_BY_ID[S.spot]){
    var wasOpen = layer.classList.contains('open'), keep = panel.scrollTop;
    panel.innerHTML = vFicha(SPOT_BY_ID[S.spot]);
    panel.scrollTop = wasOpen ? keep : 0;
    layer.classList.add('open'); layer.setAttribute('aria-hidden', 'false');
  } else {
    layer.classList.remove('open'); layer.setAttribute('aria-hidden', 'true');
  }
  var sl = $('#sheet'), sp = $('#sheet-panel');
  if (S.sheet){
    if (!sl.classList.contains('open')) sp.scrollTop = 0;
    sp.innerHTML = S.sheetKind === 'add' ? vAdd() : vPro(true);
    sl.classList.add('open'); sl.setAttribute('aria-hidden', 'false');
  } else {
    sl.classList.remove('open'); sl.setAttribute('aria-hidden', 'true');
  }
}
function applyTema(){
  try {
    var root = document.documentElement;
    if (S.tema === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', S.tema === 'escuro' ? 'dark' : 'light');
  } catch (e) { /* ignorado */ }
}
function computeOK(){
  var t = S.ref, scoresValid = true;
  SPOTS.forEach(function(sp){
    SCORE[sp.id].forEach(function(s){
      var n = s.nota;
      if (typeof n !== 'number' || isNaN(n) || n < 0 || n > 10) scoresValid = false;
    });
  });
  var hiddenFor = {};
  NIVEIS.forEach(function(n){
    hiddenFor[n] = SPOTS.filter(function(sp){ return !!motivoOculto(sp, S.hora, n); }).length;
  });
  var vis = visiveis(t, S.nivel, 'todas');
  var ns = vis.map(function(x){ return x.s.nota; });
  var faixas = {};
  vis.forEach(function(x){ faixas[rotuloNota(x.s.nota)] = true; });
  window.__TERRAL_OK__ = {
    spots: SPOTS.length,
    forecastHours: HOURLY.length,
    refHour: S.ref,
    pro: S.pro,
    dia: S.dia,
    alertas: S.alertas.length,
    favoritos: S.favoritos.length,
    scoresValid: scoresValid,
    hiddenFor: hiddenFor,
    best: vis.length ? { id: vis[0].spot.id, nota: vis[0].s.nota, potencial: vis[0].s.potencial } : null,
    spread: {
      min: ns.length ? Math.min.apply(null, ns) : null,
      max: ns.length ? Math.max.apply(null, ns) : null,
      faixas: Object.keys(faixas).length,
      altos9: ns.filter(function(n){ return n >= 9; }).length
    },
    errors: ERR
  };
}
function render(){
  try {
    setRef();
    var v = $('#view'), html;
    switch (S.tela){
      case 'mapa': html = vMapa(); break;
      case 'alertas': html = vAlertas(); break;
      case 'perfil': html = vPerfil(); break;
      default: html = vHoje();
    }
    v.innerHTML = html;
    if (S._enter){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); S._enter = false; }
    S._fadeList = false;
    document.querySelectorAll('.tab').forEach(function(b){
      if (b.getAttribute('data-v') === S.tela) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    renderLayers();
    renderOnb();
    renderBoas();
    applyTema();
    computeOK();
  } catch (e) {
    ERR.push('render: ' + (e && e.message));
  }
}
var toastT = null;
function toast(msg){
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove('on'); }, 2600);
}

/* ================= Ações ================= */
function go(tela){
  if (TELAS.indexOf(tela) < 0) return false;
  S.tela = tela; S.spot = null; S.sheet = false; S._enter = true;
  try { window.scrollTo(0, 0); } catch (e) { /* ignorado */ }
  render(); return true;
}
function openSpot(id){
  if (!SPOT_BY_ID[id]) return false;
  S.spot = id; render(); return true;
}
function closeSpot(){ S.spot = null; render(); return true; }
function openPro(){ S.sheet = true; S.sheetKind = 'pro'; render(); }
function openAdd(){ S.sheet = true; S.sheetKind = 'add'; render(); }
function closePro(){ S.sheet = false; render(); }
function setLevel(n){
  if (NIVEIS.indexOf(n) < 0) return false;
  S.nivel = n; sset('terral.nivel', n); S._fadeList = true; render();
  var oc = listar(S.ref, n, S.regiao).filter(function(x){ return x.motivo; }).length;
  toast('Nível: ' + NIVEL_NOME[n] + ' · ' + oc + (oc === 1 ? ' pico oculto' : ' picos ocultos'));
  return true;
}
function setTheme(t){
  var map = { auto: 'auto', system: 'auto', claro: 'claro', light: 'claro', escuro: 'escuro', dark: 'escuro' };
  if (!map[t]) return false;
  S.tema = map[t]; sset('terral.tema', S.tema); applyTema(); render(); return true;
}
function setRegion(r){
  if (!REGIOES[r]) return false;
  S.regiao = r; S.pin = null; S._fadeList = true; render();
  toast('Região: ' + REGIOES[r] + ' · ' + visiveis(S.ref, S.nivel, r).length + ' picos visíveis');
  return true;
}
function showOnb(){ S.onb = true; S.onbSel = S.nivel; renderOnb(); }
function finishOnb(){
  if (!S.onbSel) return;
  S.nivel = S.onbSel; sset('terral.nivel', S.nivel); sset('terral.onb', '1');
  S.onbVisto = true; S.onb = false; render();
}

/* ---- Revisão 3: ações do modo Pro ---- */
function startTrial(){
  S.pro = true; sset('terral.pro', '1');
  S.boas = true;
  toast('Pro ativado');
  go('alertas');
  clearTimeout(boasT);
  boasT = setTimeout(closeBoas, 1600);
}
function closeBoas(){
  clearTimeout(boasT);
  if (!S.boas) return;
  S.boas = false; go('alertas');
}
function setPro(on){
  S.pro = !!on; sset('terral.pro', S.pro ? '1' : '0');
  if (!S.pro){ S.dia = 0; S.sheet = false; S.boas = false; clearTimeout(boasT); }
  render(); return true;
}
function setDay(n){
  n = Number(n);
  if (!S.pro || !(n >= 0 && n <= 6)) return false;
  S.dia = n; S._fadeList = true; render(); return true;
}
function toggleFav(id){
  if (!S.pro || !SPOT_BY_ID[id]) return false;
  var i = S.favoritos.indexOf(id), nome = SPOT_BY_ID[id].nome;
  if (i >= 0){ S.favoritos.splice(i, 1); toast('Removido dos favoritos: ' + nome); }
  else { S.favoritos.push(id); toast('Favorito: ' + nome); }
  S._fadeList = true; salvarFavs(); render(); return true;
}
function irJanela(id, d){
  if (!S.pro || !SPOT_BY_ID[id]) return false;
  S.dia = d; S.tela = 'hoje'; S.sheet = false; S.spot = id; S._enter = true;
  try { window.scrollTo(0, 0); } catch (e) { /* ignorado */ }
  render(); return true;
}
function ajustarMin(id, dir){
  var a = getAlerta(id); if (!a) return false;
  var m = Math.round((a.min + dir * 0.5) * 2) / 2;
  a.min = Math.min(9.5, Math.max(5, m)); salvarAlertas(); render(); return true;
}
function toggleAlerta(id){
  var a = getAlerta(id); if (!a) return false;
  a.ativo = !a.ativo; salvarAlertas();
  toast('Alerta ' + (a.ativo ? 'ligado' : 'desligado')); render(); return true;
}
function removerAlerta(id){
  S.alertas = S.alertas.filter(function(a){ return a.id !== id; });
  salvarAlertas(); toast('Alerta removido'); render(); return true;
}
function criarAlerta(id){
  if (!addAlerta(id)) return false;
  toast('Alerta criado: ' + SPOT_BY_ID[id].nome + ' acima de 7,0');
  render(); return true;
}

document.addEventListener('click', function(ev){
  var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el) return;
  var a = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
  switch (a){
    case 'tab': if (v !== S.tela) go(v); else { S.spot = null; render(); } break;
    case 'spot': openSpot(id); break;
    case 'spot-close': closeSpot(); break;
    case 'pro': openPro(); break;
    case 'pro-close': closePro(); break;
    case 'trial': startTrial(); break;
    case 'boas-close': closeBoas(); break;
    case 'dia': setDay(v); break;
    case 'janela': irJanela(id, Number(v)); break;
    case 'fav': if (S.pro) toggleFav(id); else openPro(); break;
    case 'alerta-add-open': openAdd(); break;
    case 'alerta-add': S.sheet = false; criarAlerta(id); break;
    case 'alerta-cria': criarAlerta(id); break;
    case 'alerta-ir': go('alertas'); break;
    case 'alerta-on': toggleAlerta(id); break;
    case 'alerta-del': removerAlerta(id); break;
    case 'alerta-min': ajustarMin(id, Number(v)); break;
    case 'plano-free': setPro(false); toast('Plano grátis ativo'); break;
    case 'ir-alertas': go('alertas'); break;
    case 'plano': S.plano = v; render(); break;
    case 'nivel': setLevel(v); break;
    case 'tema': setTheme(v); break;
    case 'regiao': setRegion(v); break;
    case 'loc': S.loc = v === 'GPS' ? 'GPS' : 'Região'; render(); break;
    case 'oculto': S.ocultosAbertos = !S.ocultosAbertos; render(); break;
    case 'mapa-modo': S.mapa = v; S.pin = null; render(); break;
    case 'pin': S.pin = S.pin === id ? null : id; render(); break;
    case 'pin-close': S.pin = null; render(); break;
    case 'onb-sel': S.onbSel = v; renderOnb(); break;
    case 'onb-done': finishOnb(); break;
    case 'onb-open': showOnb(); break;
    default: break;
  }
});
document.addEventListener('keydown', function(ev){
  var t = ev.target;
  if ((ev.key === 'Enter' || ev.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.hasAttribute('data-act')){
    ev.preventDefault(); t.click();
  }
});

  get state(){
    return { tela: S.tela, nivel: S.nivel, tema: S.tema, regiao: S.regiao, hora: S.hora, refHour: S.ref,
      spot: S.spot, sheet: S.sheet, onboarding: S.onb, pin: S.pin, mapa: S.mapa,
      pro: S.pro, dia: S.dia, alertas: S.alertas.length, favoritos: S.favoritos.slice() };
  }
};

/* ================= Boot ================= */
function boot(){
  try {
    var n = sget('terral.nivel'); if (NIVEIS.indexOf(n) >= 0) S.nivel = n;
    var tm = sget('terral.tema'); if (tm === 'auto' || tm === 'claro' || tm === 'escuro') S.tema = tm;
    S.onbVisto = sget('terral.onb') === '1';
  } catch (e) { ERR.push('prefs: ' + e.message); }

  /* Revisão 3: plano Pro simulado, alertas e favoritos (sempre com leitura protegida) */
  S.pro = sget('terral.pro') === '1';
  var al = lerJSON('terral.alertas');
  if (Array.isArray(al)) S.alertas = al.filter(function(a, i, arr){
    return alertaValido(a) && arr.findIndex(function(x){ return x && x.id === a.id; }) === i;
  });
  else { S.alertas = SEMENTE_ALERTAS.map(function(a){ return { id: a.id, min: a.min, ativo: a.ativo }; }); salvarAlertas(); }
  var fv = lerJSON('terral.favoritos');
  S.favoritos = Array.isArray(fv) ? fv.filter(function(id, i, arr){ return !!SPOT_BY_ID[id] && arr.indexOf(id) === i; }) : [];

  var h = P.get('hora');
  if (h !== null && /^\d{1,2}$/.test(h) && +h <= 23) S.hora = +h;
  var nv = P.get('nivel'); if (NIVEIS.indexOf(nv) >= 0) { S.nivel = nv; sset('terral.nivel', nv); }
  var tp = P.get('tema'); if (tp === 'escuro' || tp === 'claro') S.tema = tp;
  var tl = P.get('tela'); if (TELAS.indexOf(tl) >= 0) S.tela = tl;
  var pc = P.get('pico'); if (pc && SPOT_BY_ID[pc]) S.spot = pc;
  if (P.get('pro') === '1'){ S.pro = true; sset('terral.pro', '1'); }
  var dp = P.get('dia'); if (S.pro && dp !== null && /^[0-6]$/.test(dp)) S.dia = +dp;

  S._enter = true;
  S.onb = !P.has('skip') && !S.onbVisto;
  S.onbSel = S.nivel;   // Intermediário pré-selecionado por padrão
  applyTema();
  render();
}
boot();

})();
</script>
